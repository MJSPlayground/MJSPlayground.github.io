<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 940" role="img" aria-labelledby="title desc">
  <title id="title">Vista previa de FlowCash</title>
  <desc id="desc">Ilustracion de un movil con paneles financieros de la app FlowCash.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16324e"/>
      <stop offset="55%" stop-color="#1f5f7b"/>
      <stop offset="100%" stop-color="#78d9b7"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#31a6c8"/>
      <stop offset="100%" stop-color="#78d9b7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#0a1320" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="820" height="940" rx="44" fill="url(#bg)"/>
  <circle cx="130" cy="130" r="90" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="710" cy="810" r="120" fill="#ffffff" fill-opacity="0.10"/>

  <g filter="url(#shadow)">

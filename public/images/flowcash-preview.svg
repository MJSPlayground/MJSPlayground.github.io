  <text x="270" y="226" font-family="Arial, sans-serif" font-size="18" fill="#d7f6ff">Saldo disponible</text>
  <text x="270" y="264" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#ffffff">EUR 2,840</text>


  <text x="444" y="346" font-family="Arial, sans-serif" font-size="16" fill="#5b6778">Gastos</text>
  <text x="444" y="380" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#d64249">- 790</text>

  <rect x="238" y="438" width="344" height="170" rx="28" fill="#ffffff"/>
  <text x="264" y="478" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#182033">Resumen mensual</text>
  <rect x="264" y="520" width="34" height="48" rx="12" fill="#d9eef6"/>
  <rect x="316" y="488" width="34" height="80" rx="12" fill="#b8e6db"/>
  <rect x="368" y="462" width="34" height="106" rx="12" fill="#31a6c8"/>
  <rect x="420" y="430" width="34" height="138" rx="12" fill="#78d9b7"/>
  <rect x="472" y="446" width="34" height="122" rx="12" fill="#549ecc"/>
  <rect x="524" y="504" width="34" height="64" rx="12" fill="#dce7f6"/>

  <rect x="238" y="638" width="164" height="146" rx="28" fill="#ffffff"/>
  <rect x="418" y="638" width="164" height="146" rx="28" fill="#ffffff"/>

  <text x="264" y="678" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#182033">Ahorro</text>
